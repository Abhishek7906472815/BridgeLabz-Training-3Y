<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Transformations Showcase - Q6</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main class="transform-container">
        <!-- Box 1: Rotate -->
        <div class="transform-item">
            <div class="box rotate-box"></div>
            <p class="label">rotate(45deg)</p>
        </div>

        <!-- Box 2: Scale -->
        <div class="transform-item">
            <div class="box scale-box"></div>
            <p class="label">scale(1.2)</p>
        </div>

        <!-- Box 3: Translate -->
        <div class="transform-item">
            <div class="box translate-box"></div>
            <p class="label">translateY(-15px)</p>
        </div>

        <!-- Box 4: Skew -->
        <div class="transform-item">
            <div class="box skew-box"></div>
            <p class="label">skew(15deg, 10deg)</p>
        </div>
    </main>
</body>
</html>
