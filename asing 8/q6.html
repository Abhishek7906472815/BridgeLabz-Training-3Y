<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 6: CSS Animation Demonstration</title>
    <link rel="stylesheet" href="q6.css">
</head>
<body>
    <main class="animation-stage">
        <h1>CSS Keyframes Animations</h1>
        
        <div class="animation-container">
            <!-- Animated Element 1: Moving Box -->
            <div class="anim-box moving-box">Moving Box</div>

            <!-- Animated Element 2: Bouncing Ball -->
            <div class="anim-ball bouncing-ball"></div>

            <!-- Animated Element 3: Color-Changing Text -->
            <div class="anim-text color-text">Shifting Colors</div>
        </div>
    </main>
</body>
</html>
