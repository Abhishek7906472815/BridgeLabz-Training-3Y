<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 5: Styled Button Collection</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <main class="button-showcase">
        <h1>Button Style Collection</h1>
        <p>A comprehensive set of interactive button states using Flexbox alignment.</p>

        <div class="button-row">
            <button class="btn btn-primary">Primary Button</button>
            <button class="btn btn-secondary">Secondary Button</button>
            <button class="btn btn-outline">Outline Button</button>
            <button class="btn btn-disabled" disabled>Disabled Button</button>
        </div>
    </main>
</body>
