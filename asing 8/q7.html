<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 7: UI Components Page</title>
    <link rel="stylesheet" href="q7.css">
</head>
<body>
    <main class="ui-wrapper">
        <div class="ui-card">
            <h2>User Interface Controls</h2>
            
            <!-- Search Bar Component -->
            <div class="component-group">
                <input type="text" class="search-bar" placeholder="Search records...">
            </div>

            <!-- Buttons Component -->
            <div class="component-group button-group">
                <button class="ui-btn primary-ui">Submit</button>
                <button class="ui-btn secondary-ui">Cancel</button>
            </div>

            <!-- Dropdown Menu Component -->
            <div class="component-group">
                <select class="dropdown-menu">
                    <option value="" disabled selected>Select options category</option>
                    <option value="tech">Technology</option>
                    <option value="design">UI/UX Design</option>
                    <option value="business">Business Strategy</option>
                </select>
            </div>
        </div>
    </main>
</body>
</html>
