<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 3: Image Showcase Layout</title>
    <link rel="stylesheet" href="q3.css">
</head>
<body>
    <header>
        <h1>Modern Image Showcase</h1>
        <p>Explore our curated photography collection with interactive hover effects.</p>
    </header>

    <main class="showcase-grid">
        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/id/1015/400/300" alt="Mountain Landscape">
            </div>
            <figcaption>Mountain Valley</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/id/1025/400/300" alt="Cute Puppy">
            </div>
            <figcaption>Golden Companion</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/id/1043/400/300" alt="Ocean Sunset">
            </div>
            <figcaption>Coastal Sunset</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/id/1069/400/300" alt="Forest Pathway">
            </div>
            <figcaption>Mystic Forest</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/id/1074/400/300" alt="Architecture">
            </div>
            <figcaption>Modern Architecture</figcaption>
        </figure>

        <figure class="image-card">
            <div class="image-wrapper">
                <img src="https://picsum.photos/id/1084/400/300" alt="Wildlife">
            </div>
            <figcaption>Wild Horizon</figcaption>
        </figure>
    </main>
</body>
</html>
