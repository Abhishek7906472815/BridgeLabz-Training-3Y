<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2: Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>
    <main class="tooltip-container">
        <h1>CSS Pure Tooltip Demonstration</h1>
        <p>Hover over the elements below to view smoothly fading tooltips.</p>

        <div class="elements-wrapper">
            <!-- Tooltip Element 1: Word -->
            <div class="tooltip-item">
                <span class="target-text">Hover Word</span>
                <div class="tooltip-box">This is a helpful contextual text bubble!</div>
            </div>

            <!-- Tooltip Element 2: Icon -->
            <div class="tooltip-item">
                <span class="target-icon">ℹ</span>
                <div class="tooltip-box">Information details displayed smoothly.</div>
            </div>

            <!-- Tooltip Element 3: Button -->
            <div class="tooltip-item">
                <button class="target-btn">Action Button</button>
                <div class="tooltip-box">Click to trigger primary action.</div>
            </div>
        </div>
    </main>
</body>
</html>
