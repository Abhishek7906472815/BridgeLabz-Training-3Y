<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with Modal Preview</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; text-align: center; background: #f8f9fa; }
        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 600px; margin: auto; }
        .gallery-item { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
        .gallery-item:hover { transform: scale(1.03); }

        /* Modal Overlay */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 15px; border-radius: 8px; max-width: 80%; max-height: 80%; position: relative; }
        .modal-content img { max-width: 100%; max-height: 70vh; border-radius: 4px; display: block; }
        .close-hint { margin-top: 10px; font-size: 13px; color: #666; }
    </style>
</head>
<body>

<h2>Image Gallery</h2>
<p>Click any thumbnail to preview in high resolution.</p>

<div class="gallery-grid">
    <img src="https://picsum.photos/id/1015/300/200" alt="Landscape 1" class="gallery-item">
    <img src="https://picsum.photos/id/1020/300/200" alt="Landscape 2" class="gallery-item">
    <img src="https://picsum.photos/id/1035/300/200" alt="Landscape 3" class="gallery-item">
    <img src="https://picsum.photos/id/1043/300/200" alt="Landscape 4" class="gallery-item">
    <img src="https://picsum.photos/id/1050/300/200" alt="Landscape 5" class="gallery-item">
    <img src="https://picsum.photos/id/1062/300/200" alt="Landscape 6" class="gallery-item">
</div>

<!-- Modal Popup Container -->
<div id="imageModal" class="modal">
    <div class="modal-content" id="modalBox">
        <img id="modalImage" src="" alt="Zoomed View">
        <div class="close-hint">Click outside this white box to close</div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
