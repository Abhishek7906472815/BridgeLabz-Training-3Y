<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 - Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="q1.css">
</head>
<body>
    <header>
        <h1>CSS Filter Gallery</h1>
        <p>Hover over any image to remove its filter effect.</p>
    </header>

    <main class="gallery-grid">
        <figure class="gallery-item">
            <img class="filter-blur" src="https://picsum.photos/id/1015/400/300" alt="Landscape with Blur Filter">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="filter-grayscale" src="https://picsum.photos/id/1025/400/300" alt="Dog with Grayscale Filter">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="filter-sepia" src="https://picsum.photos/id/1043/400/300" alt="Ocean with Sepia Filter">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="filter-brightness" src="https://picsum.photos/id/1069/400/300" alt="Forest with Brightness Filter">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="filter-contrast" src="https://picsum.photos/id/1074/400/300" alt="Building with Contrast Filter">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="filter-hue-rotate" src="https://picsum.photos/id/1084/400/300" alt="Walrus with Hue Rotate Filter">
            <figcaption>Hue Rotate Filter</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 Responsive CSS Gallery</p>
    </footer>
</body>
</html>
