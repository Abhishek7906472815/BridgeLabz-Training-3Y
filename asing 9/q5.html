<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q5 - Filter Cards with Animation</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>
    <header>
        <h1>Team Profile Cards</h1>
    </header>

    <main class="cards-container">
        <article class="profile-card">
            <img class="img-grayscale" src="https://picsum.photos/id/64/300/200" alt="Profile 1">
            <div class="card-content">
                <h3>Sarah Jenkins</h3>
                <p>Lead System Architect</p>
            </div>
        </article>

        <article class="profile-card">
            <img class="img-sepia" src="https://picsum.photos/id/91/300/200" alt="Profile 2">
            <div class="card-content">
                <h3>Michael Chang</h3>
                <p>Senior UX Researcher</p>
            </div>
        </article>

        <article class="profile-card">
            <img class="img-grayscale" src="https://picsum.photos/id/177/300/200" alt="Profile 3">
            <div class="card-content">
                <h3>Elena Rostova</h3>
                <p>Frontend Developer</p>
            </div>
        </article>
    </main>
</body>
</html>
