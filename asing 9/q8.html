<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q8 - Filter Comparison Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>
    <header>
        <h1>Image Filter Comparison (Before & After)</h1>
    </header>

    <main class="comparison-container">
        <figure class="comparison-box">
            <img src="https://picsum.photos/id/1062/500/350" alt="Original Image">
            <figcaption>Original Image (Unfiltered)</figcaption>
        </figure>

        <figure class="comparison-box">
            <img class="filtered-img" src="https://picsum.photos/id/1062/500/350" alt="Filtered Image">
            <figcaption>Contrast Filtered (Hover to reset)</figcaption>
        </figure>
    </main>
</body>
</html>
