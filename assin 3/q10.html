<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Select Your Preferences</h1>

  <label for="country">Country:</label>
  <select id="country" name="country">
    <option value="india" selected>India</option>
    <option value="usa">USA</option>
    <option value="uk">UK</option>
  </select>
  <br><br>

  <label for="state">State:</label>
  <select id="state" name="state">
    <option value="up" selected>Uttar Pradesh</option>
    <option value="rj">Rajasthan</option>
    <option value="mh">Maharashtra</option>
  </select>
  <br><br>

  <label for="city">City:</label>
  <select id="city" name="city">
    <option value="mathura" selected>Mathura</option>
    <option value="agra">Agra</option>
    <option value="lucknow">Lucknow</option>
  </select>
  <br><br>

  <label for="place">Favorite Tourist Place:</label>
  <select id="place" name="place">
    <option value="taj" selected>Taj Mahal</option>
    <option value="redfort">Red Fort</option>
    <option value="gateway">Gateway of India</option>
  </select>

  <p>My choices: Country - India, State - Uttar Pradesh, City - Mathura, Favorite Place - Taj Mahal.</p>
</body>
</html>
