<!-- q08_student_report.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Report</title>
</head>
<body>
  <h1>Sunrise Public School</h1>

  <p>Name: Rahul Sharma | Class: 10-A</p>

  <table border="1" cellpadding="6">
    <caption>Marks Report</caption>
    <thead>
      <tr>
        <th>S.No</th>
        <th>Subject</th>
        <th title="Maximum marks are 100">Marks</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>Maths</td><td>90</td></tr>
      <tr><td>2</td><td>Science</td><td>85</td></tr>
      <tr><td>3</td><td>English</td><td>78</td></tr>
      <tr><td>4</td><td>Hindi</td><td>82</td></tr>
      <tr><td>5</td><td>Computer</td><td>95</td></tr>
      <!-- Total and Percentage rows using colspan -->
      <tr>
        <th colspan="2" title="Sum of all subjects">Total</th>
        <td>430 / 500</td>
      </tr>
      <tr>
        <th colspan="2" title="Total divided by 5">Percentage</th>
        <td>86%</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
